name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_BASE_PATH: /
        run: |
          npm run build
          node prerender.mjs
          # 404 redirect page — also includes preload-error handler
          cat > dist/404.html << 'EOF'
          <!doctype html><html><head><meta charset="UTF-8">
          <script>sessionStorage.redirect=location.href</script>
          <script>
            window.addEventListener('vite:preloadError',function(){
              if(!sessionStorage.getItem('reloaded')){
                sessionStorage.setItem('reloaded','1')
                window.location.href=window.location.href.split('?')[0]+'?v='+Date.now()
              }else{sessionStorage.removeItem('reloaded')}
            })
          </script>
          <meta http-equiv="refresh" content="0;URL=/"></head></html>
          EOF
          # Service worker to clear stale caches on every deploy
          BUILD_HASH=$(find dist/assets -name '*.js' | head -1 | xargs basename)
          cat > dist/sw-clear.js << SWEOF
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', e => {
            e.waitUntil(caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))));
          });
          SWEOF
          echo 'www.majogadgets.com' > dist/CNAME

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
