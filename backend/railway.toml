[build]
builder = "nixpacks"

[deploy]
startCommand = "python manage.py migrate --noinput && python manage.py shell -c \"from django.contrib.auth import get_user_model; U=get_user_model(); U.objects.filter(email='majogadgets@admin.com').exists() or U.objects.create_superuser(email='majogadgets@admin.com', name='Majo Gadgets', password='Majogadgets@2026!')\" && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
healthcheckPath = "/api/products/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
